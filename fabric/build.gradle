plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:6.1.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.1.3'
    testImplementation 'org.assertj:assertj-core:3.27.7'
    testRuntimeOnly 'org.slf4j:slf4j-api:2.0.13'
    testRuntimeOnly 'org.slf4j:slf4j-simple:2.0.13'
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = mod_id
        enableGameTests = true
        enableClientGameTests = true
        eula = true
    }
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}

sourceSets {
    test {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
    gametest {
        compileClasspath += configurations.testCompileClasspath
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += configurations.testRuntimeClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

tasks.named('test', Test) {
    useJUnitPlatform()
    // Headless Minecraft server boot for integration tests
    systemProperty('java.awt.headless', 'true')
    systemProperty('file.encoding', 'UTF-8')
    minHeapSize = '512m'
    maxHeapSize = '2g'
    jvmArgs = ['--add-opens', 'java.base/java.lang=ALL-UNNAMED']
}
