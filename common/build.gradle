plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

neoForge {
    neoFormVersion = neo_form_version
    // Automatically enable AccessTransformers if the file exists
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
}

dependencies {
    compileOnly group: 'org.spongepowered', name: 'mixin', version: '0.8.5'
    // fabric and neoforge both bundle mixinextras, so it is safe to use it in common
    compileOnly group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.5.5'
    annotationProcessor group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.5.5'

    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:6.1.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.1.3'
    testImplementation 'org.assertj:assertj-core:3.27.7'
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testRuntimeOnly 'org.slf4j:slf4j-api:2.0.13'
    testRuntimeOnly 'org.slf4j:slf4j-simple:2.0.13'
    testRuntimeOnly 'org.apache.logging.log4j:log4j-api:2.26.1'
    testImplementation 'com.google.guava:guava:33.4.0-jre'
    testRuntimeOnly 'com.mojang:logging:1.6.11'
}

tasks.named('test', Test) {
    useJUnitPlatform()
    // Headless Minecraft server boot for integration tests
    systemProperty('java.awt.headless', 'true')
    systemProperty('file.encoding', 'UTF-8')
    // Give the test JVM enough memory to boot a dedicated server
    minHeapSize = '512m'
    maxHeapSize = '2g'
    // Forward system properties needed by Minecraft
    jvmArgs = ['--add-opens', 'java.base/java.lang=ALL-UNNAMED']
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'common')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'common')
            }
        }
    }
}
