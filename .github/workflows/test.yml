name: Test Mod on All Loaders

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        loader: [fabric, neoforge]
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests for ${{ matrix.loader }}
        run: ./gradlew :${{ matrix.loader }}:test :common:test --console=plain

      - name: Run in-server game tests (Fabric)
        if: matrix.loader == 'fabric'
        run: ./gradlew :fabric:runGameTest --console=plain || true

      - name: Run in-server game tests (NeoForge)
        if: matrix.loader == 'neoforge'
        run: ./gradlew :neoforge:runGameTestServer --console=plain || true

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-${{ matrix.loader }}
          path: |
            ${{ matrix.loader }}/build/reports/tests/test/
            ${{ matrix.loader }}/build/test-results/test/
            ${{ matrix.loader }}/build/run/gameTest/
            ${{ matrix.loader }}/build/run/gametest/
            common/build/reports/tests/test/
            common/build/test-results/test/
          if-no-files-found: warn

  test-all:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run all module tests
        run: ./gradlew check --console=plain

      - name: Upload all test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-all
          path: |
            */build/reports/tests/test/
            */build/test-results/test/
            */build/run/gameTest/
            */build/run/gametest/
          if-no-files-found: warn
